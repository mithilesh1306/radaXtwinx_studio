<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#D4AF37;--gap:10px;--r:12px;--max:960px}
body{background:#0c0c0c;font-family:'Poppins',sans-serif}

.hdr{padding:3rem 1.5rem 1.8rem;text-align:center}
.tag{color:var(--gold);font-size:.6rem;letter-spacing:.5em;text-transform:uppercase;font-weight:600;margin-bottom:.6rem;display:block}
.hdr h2{font-family:'Playfair Display',serif;font-size:2.6rem;color:#fff;line-height:1.15}
.hdr h2 em{color:var(--gold);font-style:italic;font-weight:400}
.bar{width:52px;height:1px;background:var(--gold);opacity:.5;margin:.9rem auto 0}

.gallery{
  max-width:var(--max);
  margin:0 auto;
  padding:1rem 1.5rem 4rem;
  display:flex;
  flex-direction:column;
  gap:32px;
}

.section-label{
  display:flex;align-items:center;gap:14px;
  color:var(--gold);font-size:.58rem;letter-spacing:.4em;text-transform:uppercase;font-weight:600;
  margin-bottom:-18px;
}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(212,175,55,.3),transparent)}

/* ── ROW: fixed height, flex children fill perfectly ── */
.row{
  width:100%;
  display:flex;
  gap:var(--gap);
  opacity:0;
  transform:translateY(40px);
  transition:opacity .7s ease,transform .7s cubic-bezier(.16,.84,.44,1);
}
.row.vis{opacity:1;transform:translateY(0)}

/* Portrait 9:16 col — fixed width based on row height */
.col-p{flex:0 0 auto;display:flex;flex-direction:column}
/* Stacked col — fills rest */
.col-s{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}

/* top = 16:9, bottom = 1:1 */
.cell-top{flex:1.78;min-height:0;position:relative}
.cell-bot{flex:1;min-height:0;position:relative}
.cell-full{flex:1;min-height:0;position:relative}

/* shared cell skin */
.cell{
  position:absolute;inset:0;
  border-radius:var(--r);
  overflow:hidden;
  background:#1a1a1a;
  border:1px solid rgba(255,255,255,.06);
  cursor:zoom-in;
  transition:border-color .35s,transform .3s;
}
.cell:hover{border-color:rgba(212,175,55,.6);transform:scale(1.013);z-index:4}
.cell img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.82);transition:filter .45s,transform .55s}
.cell:hover img{filter:brightness(1.05);transform:scale(1.06)}
.ov{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 45%);
  opacity:0;transition:opacity .3s;
  display:flex;align-items:flex-end;padding:.7rem .8rem;pointer-events:none;
}
.cell:hover .ov{opacity:1}
.num{
  color:var(--gold);font-size:.5rem;letter-spacing:2px;
  border:1px solid rgba(212,175,55,.45);border-radius:20px;
  padding:2px 8px;background:rgba(0,0,0,.55);font-family:'Poppins',sans-serif;
}

/* LIGHTBOX — faux fixed using tall wrapper */
.lb-wrap{
  display:none;
  width:100%;
  min-height:560px;
  background:rgba(8,8,8,.98);
  align-items:center;justify-content:center;
  flex-direction:column;gap:14px;padding:24px 20px;
  border-top:1px solid rgba(212,175,55,.12);
  border-bottom:1px solid rgba(212,175,55,.12);
}
.lb-wrap.open{display:flex}
#lb-img{max-width:100%;max-height:460px;object-fit:contain;border-radius:10px;border:1px solid rgba(212,175,55,.18);transition:opacity .3s}
.lb-top{width:100%;display:flex;justify-content:flex-end;margin-bottom:-8px}
.lb-close{background:none;border:1px solid rgba(212,175,55,.3);color:var(--gold);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.lb-close:hover{background:rgba(212,175,55,.15);color:#fff}
.lb-nav{display:flex;align-items:center;gap:20px;margin-top:10px}
.lb-arr{width:46px;height:46px;border-radius:50%;background:rgba(20,20,20,.9);border:1px solid rgba(212,175,55,.35);color:var(--gold);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.lb-arr:hover{background:rgba(212,175,55,.18);color:#fff}
.lb-meta{text-align:center}
.lb-count{color:rgba(212,175,55,.55);font-size:.62rem;letter-spacing:3px;display:block}
.lb-alt{color:rgba(255,255,255,.25);font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-top:3px}

@media(max-width:600px){
  .hdr h2{font-size:1.9rem}
  .gallery{padding:.8rem 1rem 3rem;gap:22px}
}
</style>

<h2 class="sr-only">Wedding photography gallery — full-page centred layout with aspect ratio groups</h2>

<div class="hdr">
  <span class="tag">Portfolio Collection</span>
  <h2>Wedding <em>Stories</em></h2>
  <div class="bar"></div>
</div>

<div class="gallery" id="gallery"></div>

<div class="lb-wrap" id="lb">
  <div class="lb-top"><button class="lb-close" id="lbc" aria-label="Close">&#x2715;</button></div>
  <img id="lb-img" src="" alt=""/>
  <div class="lb-meta">
    <span class="lb-count" id="lcnt">1 / 12</span>
    <span class="lb-alt" id="lalt"></span>
  </div>
  <div class="lb-nav">
    <button class="lb-arr" id="lp">&#8592;</button>
    <button class="lb-arr" id="ln">&#8594;</button>
  </div>
</div>

<script>
const images=[
  {src:'weddingphotos/1000 (1).jpg',       alt:'Wedding ceremony'},
  {src:'weddingphotos/377 (2).jpg',         alt:'Bride portrait'},
  {src:'weddingphotos/464 (2).jpg',         alt:'Candid moment'},
  {src:'weddingphotos/553 (1).jpg',         alt:'Couple portrait'},
  {src:'weddingphotos/558 (1).jpg',         alt:'Wedding reception'},
  {src:'weddingphotos/DSC05140 (1).jpg',    alt:'Traditional Tamil wedding'},
  {src:'weddingphotos/na18 (1).jpg',        alt:'Bridal photography'},
  {src:'weddingphotos/R5 (1).jpg',          alt:'Couple portrait Tamil Nadu'},
  {src:'weddingphotos/TJ1 (1).jpg',         alt:'Wedding by Rada Photography'},
  {src:'weddingphotos/Untitled-1FINAL.jpg', alt:'Fine art wedding'},
  {src:'weddingphotos/7621.jpg',            alt:'Wedding moment'},
  {src:'weddingphotos/9052.jpg',            alt:'Artistic wedding photography'},
];

/*
  ROW HEIGHT = 400px
  Pattern A (even):  [9:16 portrait LEFT 225px wide] | [16:9 top + 1:1 bottom RIGHT]
  Pattern B (odd):   [16:9 top + 1:1 bottom LEFT]   | [9:16 portrait RIGHT 225px wide]
  Portrait width = 400 * 9/16 = 225px exactly
  Right col = 960 - 225 - 10(gap) - (2*24 padding) = fills flex:1
  Top cell flex:1.78 ≈ 16:9, Bottom cell flex:1 ≈ 1:1
*/

const ROW_H=400;
const PORT_W=Math.round(ROW_H*9/16); // 225px

const labels=['Ceremony','Portraits','Candid','Moments'];
const gallery=document.getElementById('gallery');
let lcur=0;

for(let i=0;i<images.length;i+=3){
  const chunk=images.slice(i,i+3);
  if(chunk.length<2) break;
  const gi=Math.floor(i/3);
  const flip=gi%2===1;

  // section label
  const lbl=document.createElement('div');
  lbl.className='section-label';
  lbl.textContent=labels[gi%labels.length];
  gallery.appendChild(lbl);

  // row
  const row=document.createElement('div');
  row.className='row';
  row.style.height=ROW_H+'px';

  if(!flip){
    // A: portrait LEFT | stacked RIGHT
    row.appendChild(makePortraitCol(chunk[0], i));
    row.appendChild(makeStackedCol(chunk[1], chunk[2], i+1, i+2));
  } else {
    // B: stacked LEFT | portrait RIGHT
    row.appendChild(makeStackedCol(chunk[0], chunk[1], i, i+1));
    row.appendChild(makePortraitCol(chunk[2]||chunk[1], chunk[2]?i+2:i+1));
  }

  gallery.appendChild(row);
}

function makePortraitCol(img, idx){
  const col=document.createElement('div');
  col.className='col-p';
  col.style.width=PORT_W+'px';
  col.style.height='100%';

  const wrap=document.createElement('div');
  wrap.className='cell-full';
  wrap.style.position='relative';
  wrap.style.flex='1';
  wrap.style.minHeight='0';
  wrap.appendChild(makeCell(img,idx));
  col.appendChild(wrap);
  return col;
}

function makeStackedCol(img1, img2, idx1, idx2){
  const col=document.createElement('div');
  col.className='col-s';

  const top=document.createElement('div');
  top.className='cell-top';
  top.appendChild(makeCell(img1,idx1));
  col.appendChild(top);

  if(img2){
    const bot=document.createElement('div');
    bot.className='cell-bot';
    bot.appendChild(makeCell(img2,idx2));
    col.appendChild(bot);
  }
  return col;
}

function makeCell(img, idx){
  if(!img) return document.createElement('div');
  const cell=document.createElement('div');
  cell.className='cell';
  const el=document.createElement('img');
  el.src=img.src; el.alt=img.alt;
  el.loading=idx<6?'eager':'lazy';
  const ov=document.createElement('div');
  ov.className='ov';
  const num=document.createElement('span');
  num.className='num';
  num.textContent=String(idx+1).padStart(2,'0');
  ov.appendChild(num);
  cell.appendChild(el);
  cell.appendChild(ov);
  cell.addEventListener('click',()=>openLb(idx));
  return cell;
}

// scroll reveal
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target)}
  });
},{threshold:0.05});
document.querySelectorAll('.row').forEach(r=>obs.observe(r));

// LIGHTBOX
const lb=document.getElementById('lb');
const lbImg=document.getElementById('lb-img');
const lcnt=document.getElementById('lcnt');
const lalt=document.getElementById('lalt');

function openLb(i){
  lcur=i;
  lbImg.style.opacity='0';
  lbImg.src=images[i].src; lbImg.alt=images[i].alt;
  lbImg.onload=()=>lbImg.style.opacity='1';
  lcnt.textContent=`${i+1} / ${images.length}`;
  lalt.textContent=images[i].alt;
  lb.classList.add('open');
  lb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closeLb(){lb.classList.remove('open');}
document.getElementById('lbc').onclick=closeLb;
document.getElementById('lp').onclick=()=>openLb((lcur-1+images.length)%images.length);
document.getElementById('ln').onclick=()=>openLb((lcur+1)%images.length);
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')openLb((lcur-1+images.length)%images.length);
  if(e.key==='ArrowRight')openLb((lcur+1)%images.length);
});
</script>
